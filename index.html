<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Model Canvas Generator</title><style>:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#182438;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1450px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(23px,3vw,36px);margin:0}p{color:#596579}.panel{background:white;border:1px solid #dce3ed;border-radius:14px;padding:16px;margin:16px 0}.inputs{display:grid;grid-template-columns:1fr 180px 150px;gap:10px}label{font-weight:650;font-size:14px}textarea,select{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:white}textarea{min-height:94px;resize:vertical}button{border:0;border-radius:9px;background:#2458d3;color:white;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#e9effb;color:#21447e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.canvas{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:auto auto auto;gap:9px}.block{background:#fff;border:1px solid #d8e1ec;border-radius:11px;padding:12px;min-width:0}.block h2{font-size:15px;margin:0 0 3px}.block small{color:#64748b}.block ul{padding-left:18px;margin:10px 0 0}.block li{margin:7px 0;font-size:13px;line-height:1.5;outline-offset:2px}.block li:focus{background:#fff6d9}.block button{font-size:12px;padding:5px 9px;margin-top:10px}.b8{grid-column:1/3;grid-row:1/3}.b7{grid-column:3/5;grid-row:1}.b6{grid-column:3/5;grid-row:2}.b2{grid-column:5/7;grid-row:1/3;background:#f0f8ff;border-color:#8eb9ed}.b4{grid-column:7/9;grid-row:1}.b3{grid-column:7/9;grid-row:2}.b1{grid-column:9/11;grid-row:1/3}.b9{grid-column:1/6;grid-row:3}.b5{grid-column:6/11;grid-row:3}.hint{font-size:13px;color:#64748b}.note{font-size:12px;color:#64748b}@media(max-width:950px){.canvas{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}.block{grid-column:auto!important;grid-row:auto!important}.b2{order:-1}.inputs{grid-template-columns:1fr 1fr}.inputs>div:first-child{grid-column:1/-1}}@media(max-width:560px){.wrap{padding:12px}.canvas{grid-template-columns:1fr}.inputs{grid-template-columns:1fr}.inputs>div:first-child{grid-column:auto}.block{padding:15px}.block li{font-size:14px}button{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button:first-child{grid-column:1/-1}}@media print{@page{size:A3 landscape;margin:10mm}.panel,.actions,.hint,header p,.block button{display:none!important}.wrap{max-width:none;padding:0}.canvas{display:grid;grid-template-columns:repeat(10,minmax(0,1fr))}.block{break-inside:avoid}.block li{font-size:10px}h1{font-size:22px}}</style></head><body><main class="wrap"><header><div><h1>Business Model Canvas</h1><p>สร้างแผนธุรกิจ 9 ส่วนจาก Value Proposition · เหมาะกับมือถือและคอมพิวเตอร์</p></div><span class="note">บันทึกในอุปกรณ์นี้เท่านั้น</span></header><section class="panel"><div class="inputs"><div><label for="value">2. Value Proposition — สินค้าหรือบริการของคุณ</label><textarea id="value" placeholder="ตัวอย่าง: กาแฟออร์แกนิกจากเกษตรกรเชียงใหม่ จำหน่ายออนไลน์ให้คนรักสุขภาพ"></textarea></div><div><label for="type">ประเภทธุรกิจ</label><select id="type"><option value="product">สินค้า</option><option value="service">บริการ</option><option value="digital">ดิจิทัล</option></select></div><div><label for="count">จำนวนข้อ / ส่วน</label><select id="count"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option></select></div></div><div class="actions"><button id="generate">สร้าง Canvas ทั้ง 9 ส่วน</button><button class="secondary" id="export">ส่งออก JSON</button><button class="secondary" id="print">พิมพ์ / PDF</button><button class="secondary" id="reset">ล้างข้อมูล</button></div><p class="hint">แตะข้อความแต่ละข้อเพื่อแก้ไขได้ทันที · เวอร์ชันนี้ใช้เทมเพลต ไม่ได้เชื่อมต่อ AI</p></section><section class="canvas" id="canvas"></section></main><script>
const blocks=[['8','Key Partners','พันธมิตรหลัก'],['7','Key Activities','กิจกรรมหลัก'],['6','Key Resources','ทรัพยากรหลัก'],['2','Value Propositions','คุณค่าที่นำเสนอ'],['4','Customer Relationships','ความสัมพันธ์ลูกค้า'],['3','Channels','ช่องทาง'],['1','Customer Segments','กลุ่มลูกค้า'],['9','Cost Structure','โครงสร้างต้นทุน'],['5','Revenue Streams','แหล่งรายได้']];
const ideas={1:['ลูกค้าที่มีปัญหาซึ่ง {v} สามารถช่วยแก้ไข','กลุ่มผู้ซื้อที่ให้ความสำคัญกับคุณภาพและความน่าเชื่อถือ','กลุ่มผู้ซื้อที่เปรียบเทียบความคุ้มค่าก่อนตัดสินใจ','กลุ่มลูกค้าที่ซื้อผ่านช่องทางออนไลน์','ลูกค้าที่มีแนวโน้มซื้อซ้ำหรือใช้บริการต่อเนื่อง','กลุ่มลูกค้าที่ต้องการความสะดวกและประหยัดเวลา','ผู้ใช้ที่ได้รับคำแนะนำจากคนรู้จัก','ลูกค้าองค์กรที่มีความต้องการเกี่ยวข้อง','กลุ่มผู้ทดลองใช้ผลิตภัณฑ์หรือบริการใหม่','ลูกค้าในพื้นที่เป้าหมายและตลาดใกล้เคียง'],2:['นำเสนอ {v}','แก้ปัญหาหลักของลูกค้าด้วยคุณค่าที่ชัดเจน','สร้างประสบการณ์ใช้งานหรือซื้อที่สะดวก','ให้ข้อมูลสินค้าและบริการอย่างโปร่งใส','รักษาคุณภาพให้สม่ำเสมอ','ออกแบบข้อเสนอให้ตรงกับกลุ่มลูกค้า','มีบริการช่วยเหลือก่อนและหลังการขาย','สร้างความแตกต่างจากทางเลือกในตลาด','ลดเวลาและขั้นตอนที่ลูกค้าต้องใช้','พัฒนาข้อเสนอจากข้อเสนอแนะของลูกค้า'],3:['เว็บไซต์หรือหน้าร้านออนไลน์ของธุรกิจ','สื่อสังคมออนไลน์ที่กลุ่มเป้าหมายใช้งาน','ช่องทางแชตสำหรับสอบถามและสั่งซื้อ','พันธมิตรหรือผู้จัดจำหน่าย','การแนะนำแบบปากต่อปาก','กิจกรรมสาธิตหรือทดลองใช้','การค้นหาผ่านเสิร์ชเอนจิน','อีเมลหรือข้อความถึงลูกค้าที่สมัครรับข่าวสาร','ช่องทางขายตรงสำหรับลูกค้าองค์กร','จุดจำหน่ายหรือพื้นที่ให้บริการที่เหมาะสม'],4:['ตอบคำถามลูกค้าอย่างรวดเร็ว','สื่อสารเงื่อนไขการซื้อและบริการอย่างชัดเจน','ติดตามความพึงพอใจหลังการขาย','จัดระบบรับข้อร้องเรียนและแก้ไขปัญหา','สร้างฐานข้อมูลลูกค้าโดยได้รับความยินยอม','ให้คำแนะนำตามความต้องการลูกค้า','เสนอสิทธิประโยชน์สำหรับลูกค้าประจำ','เปิดรับความคิดเห็นเพื่อปรับปรุงบริการ','สื่อสารข่าวสารและข้อเสนอที่เกี่ยวข้อง','สร้างชุมชนหรือพื้นที่แลกเปลี่ยนประสบการณ์'],5:['รายได้จากการขาย {v}','รายได้จากการซื้อซ้ำของลูกค้าเดิม','รายได้จากชุดสินค้าหรือแพ็กเกจบริการ','รายได้จากรุ่นพรีเมียมหรือบริการเสริม','รายได้จากคำสั่งซื้อจำนวนมาก','รายได้จากการขายผ่านพันธมิตร','รายได้จากสัญญาระยะยาว (หากเหมาะสม)','รายได้จากการสมัครสมาชิก (หากเหมาะสม)','รายได้จากการจัดกิจกรรมหรืออบรม (หากเหมาะสม)','รายได้จากตลาดหรือกลุ่มลูกค้าใหม่'],6:['บุคลากรที่มีทักษะเกี่ยวกับ {v}','องค์ความรู้และมาตรฐานการทำงาน','เงินทุนหมุนเวียนสำหรับดำเนินธุรกิจ','อุปกรณ์หรือเทคโนโลยีที่จำเป็น','แบรนด์และความน่าเชื่อถือ','ข้อมูลความต้องการของลูกค้า','ช่องทางสื่อสารและจำหน่าย','ระบบจัดการคำสั่งซื้อและบริการ','เครือข่ายพันธมิตรและผู้เชี่ยวชาญ','สิทธิและใบอนุญาตที่เกี่ยวข้อง (หากจำเป็น)'],7:['พัฒนาและปรับปรุง {v}','ควบคุมคุณภาพสินค้าและบริการ','วางแผนการตลาดและหาลูกค้า','จัดการคำสั่งซื้อและการส่งมอบ','ให้บริการลูกค้าและแก้ไขปัญหา','วิเคราะห์ความคิดเห็นของลูกค้า','บริหารต้นทุนและกระแสเงินสด','ติดตามผลการขายและตัวชี้วัด','ประสานงานกับผู้ขายและพันธมิตร','ทดสอบแนวคิดใหม่และปรับปรุงอย่างต่อเนื่อง'],8:['ผู้จัดหาวัตถุดิบหรือผู้ให้บริการที่จำเป็น','ผู้ให้บริการขนส่งหรือส่งมอบ','พันธมิตรด้านการตลาดและประชาสัมพันธ์','ผู้ให้บริการชำระเงิน','ผู้ให้บริการเทคโนโลยี','ช่องทางจำหน่ายและตัวแทนขาย','ผู้เชี่ยวชาญเฉพาะด้าน','หน่วยงานสนับสนุนผู้ประกอบการ','เครือข่ายธุรกิจในพื้นที่','พันธมิตรที่ช่วยเข้าถึงกลุ่มลูกค้าใหม่'],9:['ต้นทุนการผลิตหรือจัดหาสินค้า','ค่าจ้างและค่าตอบแทนบุคลากร','ค่าโฆษณาและการตลาด','ค่าเช่าพื้นที่หรือระบบออนไลน์','ค่าขนส่งและบรรจุภัณฑ์','ค่าซอฟต์แวร์และเทคโนโลยี','ค่าธรรมเนียมการชำระเงิน','ค่าให้บริการลูกค้า','ค่าพัฒนาคุณภาพและผลิตภัณฑ์','ค่าใช้จ่ายด้านกฎหมายและบัญชี']};
let data={};try{data=JSON.parse(localStorage.getItem('bmc-data')||'{}')}catch(e){};const value=document.getElementById('value'),type=document.getElementById('type'),count=document.getElementById('count');value.value=data.value||'';type.value=data.type||'product';count.value=String(data.count||10);function save(){data.value=value.value;data.type=type.value;data.count=Number(count.value);localStorage.setItem('bmc-data',JSON.stringify(data))}function render(){const canvas=document.getElementById('canvas');canvas.replaceChildren();for(const [id,title,thai] of blocks){const sec=document.createElement('article');sec.className='block b'+id;const h=document.createElement('h2');h.textContent=id+'. '+title;const s=document.createElement('small');s.textContent=thai;const ul=document.createElement('ul');(data[id]||[]).forEach((line,i)=>{const li=document.createElement('li');li.contentEditable='true';li.textContent=line;li.setAttribute('aria-label','แก้ไขข้อ '+(i+1));li.addEventListener('input',()=>{data[id][i]=li.textContent;save()});ul.appendChild(li)});const add=document.createElement('button');add.className='secondary';add.textContent='+ เพิ่มข้อ';add.onclick=()=>{(data[id]??=[]).push('คลิกเพื่อแก้ไขข้อความ');save();render()};sec.append(h,s,ul,add);canvas.appendChild(sec)}}function generate(){const v=value.value.trim();if(!v){alert('กรุณากรอกสินค้าหรือบริการใน Value Proposition');value.focus();return}const n=Number(count.value);for(const [id] of blocks)data[id]=ideas[id].slice(0,n).map(t=>t.replaceAll('{v}',v));save();render()}document.getElementById('generate').onclick=generate;document.getElementById('print').onclick=()=>window.print();document.getElementById('export').onclick=()=>{save();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='business-model-canvas.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('reset').onclick=()=>{if(confirm('ล้างข้อมูล Canvas ทั้งหมด?')){data={};value.value='';localStorage.removeItem('bmc-data');render()}};[value,type,count].forEach(el=>el.addEventListener('change',save));render();
</script></body></html>
